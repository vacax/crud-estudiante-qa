plugins {
    id 'application'
    id 'java-test-fixtures'
    id 'jvm-test-suite'
    id 'jacoco'
    alias(libs.plugins.spotless)
}

group = 'edu.pucmm'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'edu.pucmm.estudiante.Aplicacion'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

dependencies {
    // Web (fase 3). JavalinJackson usa Jackson 2.x (com.fasterxml) por defecto.
    implementation libs.javalin
    implementation libs.jackson.databind
    // Persistencia (fase 2).
    implementation libs.postgresql
    implementation libs.hikari
    implementation libs.flyway.core
    runtimeOnly libs.flyway.postgresql
    runtimeOnly libs.slf4j.simple
}

testing {
    suites {
        // Nivel 1: pruebas unitarias (sin BD, sin red, sin Javalin).
        test {
            useJUnitJupiter(libs.versions.junit)
            dependencies {
                implementation testFixtures(project())
                implementation libs.assertj
                implementation libs.mockito.core
                implementation libs.mockito.junit.jupiter
            }
        }

        // Nivel 2: integracion (repositorio JDBC + Flyway contra PostgreSQL real).
        integrationTest(JvmTestSuite) {
            useJUnitJupiter(libs.versions.junit)
            dependencies {
                implementation project()
                implementation testFixtures(project())
                implementation libs.assertj
                implementation libs.testcontainers.postgresql
                implementation libs.testcontainers.junit.jupiter
                implementation libs.postgresql
                implementation libs.hikari
                implementation libs.flyway.core
                runtimeOnly libs.flyway.postgresql
            }
            targets.configureEach {
                testTask.configure {
                    shouldRunAfter(tasks.named('test'))
                    // Ejecutable sola: ./gradlew integrationTest (aun no se engancha a 'check').
                    // Reporte HTML en build/reports/tests/integrationTest.
                    reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/integrationTest')
                }
            }
        }

        // Nivel 3: aceptacion (Cucumber en espanol + REST Assured).
        acceptanceTest(JvmTestSuite) {
            useJUnitJupiter(libs.versions.junit)
            dependencies {
                implementation project()
                implementation testFixtures(project())
                implementation libs.assertj
                implementation libs.rest.assured
                implementation libs.javalin
                implementation libs.jackson.databind
                // Cucumber 8 necesita Jackson (databind + jdk8) para escribir reportes JSON/HTML.
                implementation libs.jackson.jdk8
                implementation libs.postgresql
                implementation libs.hikari
                implementation libs.flyway.core
                runtimeOnly libs.flyway.postgresql
                implementation platform(libs.cucumber.bom)
                implementation libs.cucumber.java
                implementation libs.cucumber.junit.platform.engine
                implementation platform(libs.junit.bom)
                implementation libs.junit.platform.suite
                implementation libs.testcontainers.postgresql
                implementation libs.testcontainers.junit.jupiter
            }
            targets.configureEach {
                testTask.configure {
                    shouldRunAfter(tasks.named('integrationTest'))
                    // El motor cucumber lo descubre la suite @Suite; reportes en build/reports/cucumber.
                    reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/acceptanceTest')
                    // Los plugins escriben aqui; se declara para que Gradle lo trate como salida.
                    outputs.dir(layout.buildDirectory.dir('reports/cucumber'))
                }
            }
        }

        // Nivel 4: end to end (stack completo con ComposeContainer + Playwright).
        e2eTest(JvmTestSuite) {
            useJUnitJupiter(libs.versions.junit)
            dependencies {
                implementation project()
                implementation testFixtures(project())
                implementation libs.assertj
                implementation libs.rest.assured
                implementation libs.playwright
                implementation libs.testcontainers.postgresql
                implementation libs.testcontainers.junit.jupiter
            }
            targets.configureEach {
                testTask.configure {
                    shouldRunAfter(tasks.named('acceptanceTest'))
                    // NO forma parte de 'check': necesita Docker, imagen construida y navegador.
                    reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/e2eTest')
                    // Compose compartido con el despliegue real y carpeta de capturas/traces.
                    systemProperty 'compose.archivo', file('compose.yaml').absolutePath
                    systemProperty 'e2e.artefactos', layout.buildDirectory.dir('reports/e2e').get().asFile.absolutePath
                    outputs.dir(layout.buildDirectory.dir('reports/e2e'))
                    // Una sola vez por corrida (las capturas viejas no deben confundir).
                    doFirst { delete layout.buildDirectory.dir('reports/e2e') }
                    // En CI la imagen llega de un job previo (docker load): -PomitirConstruccionImagen.
                    if (!project.hasProperty('omitirConstruccionImagen')) {
                        dependsOn(tasks.named('construirImagen'))
                    }
                }
            }
        }
    }
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat(libs.versions.googleJavaFormat.get())
        removeUnusedImports()
        endWithNewline()
    }
}

// spotlessCheck ya se engancha a 'check'; se deja explicito por claridad didactica.
tasks.named('check') {
    dependsOn tasks.named('spotlessCheck')
}

// Construye la imagen local que usa compose.yaml (APP_IMAGEN por defecto).
tasks.register('construirImagen', Exec) {
    group = 'build'
    description = 'Construye la imagen Docker crud-estudiante-qa:local'
    commandLine 'docker', 'build', '-t', 'crud-estudiante-qa:local', '.'
}

// Instala Chromium para Playwright. Argumentos configurables:
//   ./gradlew instalarNavegadores                              -> "install chromium" (local, sin sudo)
//   ./gradlew instalarNavegadores -PplaywrightArgs="install --with-deps chromium"   (CI/Linux limpio)
// e2eTest NO depende de esta tarea: Playwright for Java descarga el navegador por si solo
// la primera vez que se crea, y --with-deps requiere privilegios de administrador.
tasks.register('instalarNavegadores', JavaExec) {
    group = 'verification'
    description = 'Instala los navegadores de Playwright (chromium)'
    classpath = sourceSets.e2eTest.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args = (project.findProperty('playwrightArgs') ?: 'install chromium').toString().split(/\s+/) as List
}
